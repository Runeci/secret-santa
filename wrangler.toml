name = "secret-santa-bot"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# id базы из `npx wrangler d1 create secret-santa` (не секрет)
[[d1_databases]]
binding = "DB"
database_name = "secret-santa"
database_id = "06cfad04-e33a-4f74-b277-381992d26c55"
migrations_dir = "migrations"

# Очередь для рассылки пар (бесплатный план: 50 внешних запросов на вызов,
# поэтому личные сообщения отправляются пачками по 10 из очереди).
[[queues.producers]]
binding = "OUTBOX"
queue = "santa-outbox"

[[queues.consumers]]
queue = "santa-outbox"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 4

# Напоминания о дедлайне. Приходят в 10:00 по поясу организатора (UTC+0…+12 — как в кнопках бота), а расписание
# Cloudflare работает по UTC, поэтому запускаем только в те часы UTC, когда 10:00 наступает хотя бы в одном из поясов:
# 10:00 при UTC+0 это 10 UTC, при UTC+12 — 22 UTC (накануне). Часы 0–10 и 22–23 UTC; остальные 11 запусков в сутки не нужны.
# Если меняете список поясов — меняйте и этот список (test/deadline.test.ts сверяет их).
[triggers]
crons = ["0 0-10,22-23 * * *"]
